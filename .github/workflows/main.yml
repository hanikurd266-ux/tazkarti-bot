name: Tazkarti Radar
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *' # يشتغل كل 15 دقيقة لوحده

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Radar
        run: python main.py
